<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="레이아웃_연습.css">
</head>
<body>
    <div class="container">
        <div class="layer0_left">
            <div class="logo">
                <img 
                width="40px"
                height="40px"
                src="./googleg_gradient_standard_48px.svg"
                >
            </div>
            <div class="login">
                <h1>로그인</h1>
            </div>
            <div class="login_text">Google 계정 사용</div>
        </div>

        <div class="layer0_right">
            <div class="account_info">
                <input type="text" id="account_info" placeholder="이메일 또는 휴대전화"> 
            </div>
            <div class="forget_email">
                <p>이메일을 잊으셨나요?</p>
            </div>

            <br/>
            <br/>

            <div class=wrapper>
                <div class="guess_mode0">
                    내 컴퓨터가 아닌가요? 게스트 모드를 사용하여 비공개로 로그인하세요.</div
                    ><div class="guest_mode1">
                    게스트 모드 사용 방법 자세히 알아보기</div>
            </div>
            
            <br/>            
            <br/>            
            
            <div class=wrapper1>
                <div class="button0">
                    <input type="button" id="button0" name="new_account" value="계정 만들기"> 
                </div>
                <div class="button1">
                    <input type="button" id="button1" name="next" value="다음"> 
                </div>
            </div>
        </div>
    </div>
</body>
</html>
